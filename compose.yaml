services:
  dev:
    profiles: [dev]
    build:
      context: .
      dockerfile: docker/dev.Dockerfile
    image: localhost/microduck-dev:latest
    environment:
      TERM: ${TERM:-xterm-256color}
      COLORTERM: truecolor
      DUCK_SIM_STATE: /var/lib/duck-sim
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
    volumes:
      - .:/workspace
      - sim-state:/var/lib/duck-sim
      - sim-target:/workspace/3rd_party/microduck/target
    stdin_open: true
    tty: true
  sim:
    build: .
    image: localhost/microduck-sim:latest
    environment:
      DISPLAY: ${DISPLAY:-:0}
      XAUTHORITY: /tmp/sim.xauth
      LIBGL_ALWAYS_SOFTWARE: "0"
      DUCK_SIM_VIEWER: ${DUCK_SIM_VIEWER:-1}
      DUCK_SIM_SCENE: ${DUCK_SIM_SCENE:-backlash}
      DUCK_SIM_HOST: sim
      DUCK_SIM_BIND_HOST: 0.0.0.0
      CARGO_BUILD_JOBS: ${CARGO_BUILD_JOBS:-4}
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - .:/workspace
      - sim-target:/workspace/3rd_party/microduck/target
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      # Shared by the simulation service and one-off client containers.
      - sim-state:/var/lib/duck-sim
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - ${XAUTHORITY:?Set XAUTHORITY to your desktop X11 authority file}:/tmp/host.xauth:ro
    shm_size: 256mb
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "scripts/duck-sim", "ctl", "health"]
      interval: 15s
      timeout: 10s
      start_period: 5m
      retries: 3

volumes:
  sim-target:
  cargo-registry:
  cargo-git:
  sim-state:
